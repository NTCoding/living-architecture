packages:
  - packages/*
  - packages/*/*
  - apps/*
  - tools/*

autoInstallPeers: true
engineStrict: true
minimumReleaseAge: 10080

overrides:
  '@typescript-eslint/project-service@8.53.0>@typescript-eslint/tsconfig-utils': 8.53.0
  '@typescript-eslint/project-service@8.53.0>@typescript-eslint/types': 8.54.0
  'nanoid@': 3.3.17

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  nx: true
  unrs-resolver: true
