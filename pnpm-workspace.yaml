packages:
  - packages/*
  - packages/*/*
  - apps/*
  - tools/*

autoInstallPeers: true
engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@nt-ai-lab/*'

overrides:
  'eslint-plugin-sonarjs>typescript': npm:typescript@5.9.3
  'nanoid@': 3.3.17
  postcss: 8.5.25

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true

patchedDependencies:
  '@nt-ai-lab/deterministic-agent-workflow-codex@0.4.6': patches/@nt-ai-lab__deterministic-agent-workflow-codex@0.4.6.patch
