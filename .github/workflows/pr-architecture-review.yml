name: Pull request architecture review

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-architecture-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  update-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted reporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download pull request source
        id: snapshots
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pull_request="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -r '.head.sha' <<< "${pull_request}")"

          if [[ "${head_sha}" != "${EVENT_HEAD_SHA}" ]]; then
            echo "Skipping stale workflow run for ${EVENT_HEAD_SHA}; current head is ${head_sha}."
            echo "current=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          head_root="${RUNNER_TEMP}/pull-request-head"
          mkdir -p "${head_root}"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${head_sha}" \
            --output "${RUNNER_TEMP}/pull-request-head.tar.gz"

          tar -xzf "${RUNNER_TEMP}/pull-request-head.tar.gz" --strip-components=1 -C "${head_root}"
          echo "current=true" >> "${GITHUB_OUTPUT}"

      - name: Build architecture review
        if: steps.snapshots.outputs.current == 'true'
        run: >-
          pnpm exec tsx apps/docs/scripts/build-pull-request-architecture-review.ts
          --base .
          --head "${RUNNER_TEMP}/pull-request-head"
          --output "${RUNNER_TEMP}/pull-request-architecture-review.md"

      - name: Record architecture review result
        if: steps.snapshots.outputs.current == 'true'
        env:
          COMMENT_PATH: ${{ runner.temp }}/pull-request-architecture-review.md
        run: |
          if [[ -s "${COMMENT_PATH}" ]]; then
            echo "Architecture metadata changes were detected." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No architecture metadata changes were detected." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Update pull request comment
        if: steps.snapshots.outputs.current == 'true'
        env:
          COMMENT_PATH: ${{ runner.temp }}/pull-request-architecture-review.md
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          comment_id="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq 'flatten | map(select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- pull-request-architecture-review -->"))) | first | .id // empty'
          )"

          if [[ ! -s "${COMMENT_PATH}" ]]; then
            if [[ -n "${comment_id}" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"
            fi
            exit 0
          fi

          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F "body=@${COMMENT_PATH}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${COMMENT_PATH}"
          fi
