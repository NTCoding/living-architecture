name: Agent Efficiency Report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Post the agent efficiency report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${
            github.event.pull_request.number
          }" --body-file docs/factory/agent-efficiency-report.md
