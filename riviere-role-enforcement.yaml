# Phase 3 final branch scope lock:
# Included roots:
#   - packages/riviere-cli/src/**
#   - packages/riviere-builder/src/**
#   - packages/riviere-extract-config/src/**
#   - packages/riviere-extract-ts/src/**
#   - packages/riviere-query/src/**
#   - packages/riviere-role-enforcement/src/**
#   - tools/dev-workflow/src/**
#   - tools/dev-workflow-v2/src/**
# Excluded roots:
#   - packages/riviere-schema/src/**
#   - packages/riviere-extract-conventions/src/**
#   - apps/eclair/**
# Excluded file classes:
#   - *.spec.*
#   - __fixtures__/**
#   - fixtures/**
#   - snapshot files
#   - generated outputs
#   - barrel-only files such as index.ts that declare no target symbols
# Note: the executable include allowlist below still reflects the pre-Phase-3 rollout slice.
# The dedicated Phase 3 repo-scope coverage chunk replaces it with hard full-scope semantics.
include:
  - packages/riviere-cli/src/shell/cli.ts
  - packages/riviere-cli/src/features/builder/entrypoint/**/*.ts
  - packages/riviere-cli/src/features/builder/commands/**/*.ts
  - packages/riviere-cli/src/features/builder/queries/**/*.ts
  - packages/riviere-cli/src/features/extract/entrypoint/**/*.ts
  - packages/riviere-cli/src/features/extract/commands/**/*.ts
  - packages/riviere-cli/src/features/extract/domain/**/*.ts
  - packages/riviere-cli/src/features/extract/infra/external-clients/**/*.ts
  - packages/riviere-cli/src/features/extract/infra/mappers/**/*.ts
  - packages/riviere-cli/src/features/query/entrypoint/**/*.ts
  - packages/riviere-query/src/features/querying/queries/**/*.ts
  - tools/dev-workflow-v2/src/entrypoint/**/*.ts
  - tools/dev-workflow-v2/src/infra/**/*.ts
  - tools/dev-workflow-v2/src/workflow-definition/domain/**/*.ts
ignorePatterns:
  - '**/*.spec.ts'
  - '**/fixtures/**'
  - '**/index.ts'
  - '**/__fixtures__/**'
roles:
  - name: cli-shell
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/shell/**/*.ts
    allowedNames:
      - createProgram
      - main
    markdownSpec: docs/roles/cli-shell.md
  - name: cli-package-json-parser
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/shell/**/*.ts
    allowedNames:
      - parsePackageJson
      - loadPackageJson
    markdownSpec: docs/roles/cli-package-json-parser.md
  - name: cli-entrypoint
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/entrypoint/**/*.ts
    nameMatches: '^create[A-Z][A-Za-z0-9]*Command$'
    markdownSpec: docs/roles/cli-entrypoint.md
  - name: command-orchestrator
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/commands/**/*.ts
    allowedNames:
      - addComponent
      - handleError
      - runExtraction
      - tryParseJson
    markdownSpec: docs/roles/command-orchestrator.md
  - name: cli-query-service
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/queries/**/*.ts
    allowedNames:
      - findApisByPath
      - getAllApiPaths
      - isRestApiWithPath
    markdownSpec: docs/roles/cli-query-service.md
  - name: extract-domain-service
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/extract/domain/**/*.ts
    allowedNames:
      - assertAllDraftsMatchModules
      - detectConnectionsPerModule
      - enrichPerModule
      - extractDraftComponents
      - groupDraftsByModule
    markdownSpec: docs/roles/extract-domain-service.md
  - name: extract-project-loader
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/extract/infra/external-clients/**/*.ts
    allowedNames:
      - createConfiguredProject
      - createModuleContexts
      - findModuleTsConfigDir
      - loadExtractionProject
    markdownSpec: docs/roles/extract-project-loader.md
  - name: cli-result-presenter
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/infra/mappers/**/*.ts
    allowedNames:
      - presentExtractionResult
      - presentDraftResult
      - presentFullResult
    markdownSpec: docs/roles/cli-result-presenter.md
  - name: query-service
    targets: [function, static-method]
    allowedLocation:
      - packages/riviere-query/src/features/querying/queries/**/*.ts
    allowedNames:
      - aggregateExternalDomains
      - assertValidGraph
      - buildComponentDomainMap
      - buildEventHandlerInfo
      - buildEventNameMap
      - buildExternalLinksBySource
      - buildNodeIdToDomain
      - buildOutgoingEdges
      - collectConnections
      - findComponent
      - findChangedFields
      - findEntryPointIds
      - findEventHandlerComponents
      - fromJSON
      - getOrInitializeConnectionCounts
      - incrementConnectionCount
      - initializeConnectionCounts
      - isCustomComponent
      - linkTypeForSort
      - orderStatesByTransitions
      - processQueue
      - enqueueChildren
      - createEntity
      - compareCrossDomainLinks
      - convertToExternalDomains
      - validateCustomTypes
      - toConnectionResults
      - findAllComponents
      - componentById
      - searchComponents
      - componentsInDomain
      - componentsByType
      - queryDomains
      - operationsForEntity
      - queryEntities
      - businessRulesForEntity
      - transitionsForEntity
      - statesForEntity
      - queryCrossDomainLinks
      - queryDomainConnections
      - queryNodeDepths
      - queryPublishedEvents
      - queryEventHandlers
      - queryExternalDomains
      - findEntryPoints
      - traceFlowFrom
      - queryFlows
      - searchWithFlowContext
      - diffGraphs
      - validateGraph
      - detectOrphanComponents
      - queryStats
      - compareByCodePoint
      - createLinkKey
      - parseComponentId
      - parseLinkId
      - parseEntityName
      - parseDomainName
      - parseState
      - parseOperationName
      - parseEventId
      - parseEventName
      - parseHandlerId
      - parseHandlerName
    markdownSpec: docs/roles/query-service.md
  - name: query-facade
    targets: [class]
    allowedLocation:
      - packages/riviere-query/src/features/querying/queries/**/*.ts
    allowedNames:
      - RiviereQuery
    allowedPublicMethods:
      - components
      - links
      - validate
      - detectOrphans
      - find
      - findAll
      - componentById
      - search
      - componentsInDomain
      - componentsByType
      - domains
      - operationsFor
      - entities
      - businessRulesFor
      - transitionsFor
      - statesFor
      - entryPoints
      - traceFlow
      - diff
      - publishedEvents
      - eventHandlers
      - flows
      - searchWithFlow
      - crossDomainLinks
      - domainConnections
      - stats
      - nodeDepths
      - externalLinks
      - externalDomains
    markdownSpec: docs/roles/query-facade.md
  - name: query-entity
    targets: [class]
    allowedLocation:
      - packages/riviere-query/src/features/querying/queries/**/*.ts
    allowedNames:
      - Entity
    allowedPublicMethods:
      - hasStates
      - hasBusinessRules
      - firstOperationId
    markdownSpec: docs/roles/query-entity.md
  - name: application-error
    targets: [class]
    allowedLocation:
      - packages/riviere-cli/src/features/*/domain/**/*.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
    nameMatches: '^.*Error$'
    markdownSpec: docs/roles/application-error.md
  - name: workflow-hook
    targets: [function]
    allowedLocation:
      - tools/dev-workflow-v2/src/entrypoint/**/*.ts
    allowedNames:
      - preToolUseHandler
    markdownSpec: docs/roles/workflow-hook.md
  - name: workflow-infra-client
    targets: [function]
    allowedLocation:
      - tools/dev-workflow-v2/src/infra/**/*.ts
    allowedNames:
      - detectDefaultBranch
      - getGitInfo
      - runGh
      - runGit
      - createGetPrFeedback
    markdownSpec: docs/roles/workflow-infra-client.md
  - name: workflow-domain-helper
    targets: [function, static-method]
    allowedLocation:
      - tools/dev-workflow-v2/src/workflow-definition/domain/**/*.ts
    allowedNames:
      - applyRecordingEvent
      - createWorkflowStateSchema
      - createFresh
      - parseStateName
      - checkWriteAllowed
      - isWriteAllowed
      - getStateDefinition
      - getOperationBody
      - procedurePath
      - rehydrate
      - getTransitionTitle
      - applyEvent
      - applyEvents
      - applyTransitioned
    markdownSpec: docs/roles/workflow-domain-helper.md
  - name: workflow-facade
    targets: [class]
    allowedLocation:
      - tools/dev-workflow-v2/src/workflow-definition/domain/**/*.ts
    allowedNames:
      - Workflow
    allowedPublicMethods:
      - getPendingEvents
      - getState
      - getAgentInstructions
      - appendEvent
      - startSession
      - executeRecording
    markdownSpec: docs/roles/workflow-facade.md
