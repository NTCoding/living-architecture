# Phase 3 final branch scope lock:
# Included roots:
#   - packages/riviere-cli/src/**
#   - packages/riviere-builder/src/**
#   - packages/riviere-extract-config/src/**
#   - packages/riviere-extract-ts/src/**
#   - packages/riviere-query/src/**
#   - packages/riviere-role-enforcement/src/**
#   - tools/dev-workflow/src/**
#   - tools/dev-workflow-v2/src/**
# Excluded roots:
#   - packages/riviere-schema/src/**
#   - packages/riviere-extract-conventions/src/**
#   - apps/eclair/**
# Excluded file classes:
#   - *.spec.*
#   - __fixtures__/**
#   - fixtures/**
#   - snapshot files
#   - generated outputs
#   - barrel-only files such as index.ts that declare no target symbols
# Note: the executable include allowlist below still reflects the pre-Phase-3 rollout slice.
# The dedicated Phase 3 repo-scope coverage chunk replaces it with hard full-scope semantics.
include:
  - packages/riviere-cli/src/shell/cli.ts
  - packages/riviere-cli/src/shell/bin.ts
  - packages/riviere-cli/src/features/builder/entrypoint/**/*.ts
  - packages/riviere-cli/src/features/builder/commands/**/*.ts
  - packages/riviere-cli/src/features/builder/queries/**/*.ts
  - packages/riviere-cli/src/features/extract/entrypoint/**/*.ts
  - packages/riviere-cli/src/features/extract/commands/**/*.ts
  - packages/riviere-cli/src/features/extract/domain/**/*.ts
  - packages/riviere-cli/src/features/extract/infra/external-client/**/*.ts
  - packages/riviere-cli/src/features/extract/infra/mappers/**/*.ts
  - packages/riviere-cli/src/features/query/entrypoint/**/*.ts
  - packages/riviere-cli/src/platform/**/*.ts
  - packages/riviere-builder/src/features/building/domain/**/*.ts
  - packages/riviere-builder/src/platform/domain/**/*.ts
  - packages/riviere-query/src/features/querying/queries/**/*.ts
  - packages/riviere-role-enforcement/src/features/check/domain/**/*.ts
  - packages/riviere-role-enforcement/src/features/check/infra/**/*.ts
  - packages/riviere-role-enforcement/src/features/classify/domain/**/*.ts
  - packages/riviere-role-enforcement/src/platform/**/*.ts
  - tools/dev-workflow-v2/src/entrypoint/**/*.ts
  - tools/dev-workflow-v2/src/infra/**/*.ts
  - tools/dev-workflow-v2/src/workflow-definition/domain/**/*.ts
ignorePatterns:
  - '**/*.spec.ts'
  - '**/fixtures/**'
  - '**/index.ts'
  - '**/__fixtures__/**'
roles:
  - name: cli-shell
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/shell/**/*.ts
      - tools/dev-workflow-v2/src/shell/**/*.ts
    allowedNames:
      - createProgram
      - main
    markdownSpec: docs/architecture/roles/cli-shell.md
  - name: cli-package-json-parser
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/shell/**/*.ts
    allowedNames:
      - parsePackageJson
      - loadPackageJson
    markdownSpec: docs/architecture/roles/cli-package-json-parser.md
  - name: cli-entrypoint
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/entrypoint/**/*.ts
      - tools/dev-workflow/features/*/entrypoint/**/*.ts
    nameMatches: '^create[A-Z][A-Za-z0-9]*Command$'
    markdownSpec: docs/architecture/roles/cli-entrypoint.md
  - name: command-use-case
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/commands/**/*.ts
      - tools/dev-workflow/features/*/commands/**/*.ts
    nameMatches: '^(add|run|execute|respond|push|merge|complete|handle)[A-Z].*|^(tryParseJson|handleError)$'
    markdownSpec: docs/architecture/roles/command-use-case.md
  - name: query-service
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/queries/**/*.ts
    allowedNames:
      - findApisByPath
      - getAllApiPaths
      - isRestApiWithPath
    markdownSpec: docs/architecture/roles/query-service.md
  - name: cli-output-writer
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/cli/output/**/*.ts
      - packages/riviere-cli/src/features/*/infra/cli/output/**/*.ts
    allowedNames:
      - outputResult
      - reportNoApiFoundForPath
      - reportAmbiguousApiMatch
      - reportSuccessfulAddComponent
      - reportGraphNotFound
      - reportAddComponentError
      - reportValidationErrorOutput
      - presentExtractionResult
      - presentDraftResult
      - presentFullResult
    markdownSpec: docs/architecture/roles/cli-output-writer.md
  - name: aggregate
    targets: [class, static-method]
    allowedLocation:
      - packages/riviere-builder/src/features/building/domain/builder-facade.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
      - tools/dev-workflow-v2/src/workflow-definition/domain/**/*.ts
    nameMatches: '^[A-Z][A-Za-z0-9]*$|^(new|resume|fromJSON|createFresh|rehydrate|procedurePath)$'
    markdownSpec: docs/architecture/roles/aggregate.md
  - name: entity
    targets: [class]
    allowedLocation:
      - packages/riviere-query/src/features/querying/queries/**/*.ts
    nameMatches: '^[A-Z][A-Za-z0-9]*$'
    markdownSpec: docs/architecture/roles/entity.md
  - name: value-object
    targets: [function, class]
    allowedLocation:
      - packages/riviere-query/src/features/querying/queries/domain-types.ts
      - packages/riviere-cli/src/features/extract/domain/**/*.ts
    nameMatches: '^(parse[A-Z].*|.*(Id|Name|State|Location|Context))$'
    markdownSpec: docs/architecture/roles/value-object.md
  - name: domain-service
    targets: [function, class, static-method]
    allowedLocation:
      - packages/riviere-builder/src/features/building/domain/**/*.ts
      - packages/riviere-builder/src/platform/domain/**/*.ts
      - packages/riviere-cli/src/features/extract/domain/**/*.ts
      - packages/riviere-cli/src/platform/domain/**/*.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
      - packages/riviere-extract-ts/src/features/extraction/domain/**/*.ts
      - packages/riviere-role-enforcement/src/platform/domain/**/*.ts
      - tools/dev-workflow/features/*/domain/**/*.ts
      - tools/dev-workflow/platform/domain/**/*.ts
      - tools/dev-workflow-v2/src/workflow-definition/domain/**/*.ts
    nameMatches: '^[A-Za-z][A-Za-z0-9]*$'
    markdownSpec: docs/architecture/roles/domain-service.md
  - name: domain-factory
    targets: [class, function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/domain/**/*.ts
    nameMatches: '^(create|build)[A-Z].*|^.*Builder$'
    markdownSpec: docs/architecture/roles/domain-factory.md
  - name: application-error
    targets: [class]
    allowedLocation:
      - packages/riviere-cli/src/features/*/domain/**/*.ts
      - packages/riviere-cli/src/features/*/commands/**/*.ts
      - packages/riviere-cli/src/features/*/infra/**/*.ts
      - packages/riviere-cli/src/platform/infra/**/*.ts
      - packages/riviere-builder/src/features/building/domain/**/*.ts
      - packages/riviere-extract-config/src/*.ts
      - packages/riviere-extract-ts/src/features/extraction/domain/**/*.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
      - packages/riviere-role-enforcement/src/platform/domain/**/*.ts
      - tools/dev-workflow/features/*/commands/**/*.ts
      - tools/dev-workflow/features/*/domain/**/*.ts
      - tools/dev-workflow/platform/domain/**/*.ts
      - tools/dev-workflow/platform/infra/**/*.ts
      - tools/dev-workflow-v2/src/**/domain/**/*.ts
      - tools/dev-workflow-v2/src/**/infra/**/*.ts
    nameMatches: '^.*Error$'
    markdownSpec: docs/architecture/roles/application-error.md
  - name: workflow-hook
    targets: [function]
    allowedLocation:
      - tools/dev-workflow-v2/src/entrypoint/**/*.ts
      - tools/dev-workflow/features/claude-hooks/commands/**/*.ts
    nameMatches: '^(handleHook|preToolUseHandler|postToolUseHandler|routeToHandler|shouldSkipHooks|stopHandler)$'
    markdownSpec: docs/architecture/roles/workflow-hook.md
  - name: workflow-infra-client
    targets: [function]
    allowedLocation:
      - tools/dev-workflow/platform/infra/external-client/**/*.ts
      - tools/dev-workflow-v2/src/infra/**/*.ts
    nameMatches: '^(detect|get|run|create|list|read|fetch)[A-Z].*|^.*(Client|Runner|Io)$'
    markdownSpec: docs/architecture/roles/workflow-infra-client.md
  - name: cli-input-mapper
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/cli/input/**/*.ts
      - packages/riviere-cli/src/features/*/infra/cli/input/**/*.ts
      - tools/dev-workflow/platform/infra/cli/**/*.ts
      - tools/dev-workflow/features/*/domain/**/*parser*.ts
    nameMatches: '^(parse|validate|collect|resolve|sanitize|tryParse|read|reject|normalize|build|is|has|map|to)[A-Z].*'
    markdownSpec: docs/architecture/roles/cli-input-mapper.md
  - name: cli-output-formatter
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/cli/output/**/*.ts
      - packages/riviere-cli/src/platform/infra/errors/**/*.ts
      - tools/dev-workflow/platform/infra/cli/**/*.ts
      - tools/dev-workflow/features/*/domain/*output*.ts
    nameMatches: '^(format|categorize|count|summarize|compare|to|get)[A-Z].*|^(compareByCodePoint|componentKey)$'
    markdownSpec: docs/architecture/roles/cli-output-formatter.md
  - name: middleware
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/middleware/**/*.ts
    nameMatches: '^(handle|report)[A-Z].*'
    markdownSpec: docs/architecture/roles/middleware.md
  - name: repository
    targets: [function, class]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/graph-persistence/**/*.ts
      - packages/riviere-cli/src/platform/infra/persistence/**/*.ts
    nameMatches: '^(load|read|write|save|find|resolve|get|with|parse|is|report|handle|try)[A-Z].*|^fileExists$|^.*Repository$'
    markdownSpec: docs/architecture/roles/repository.md
  - name: data-store
    targets: [function, class]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/persistence/**/*.ts
    nameMatches: '^(load|read|write|save|find|resolve|get|create|build|parse|expand|is|has|try)[A-Z].*|^.*Store$'
    markdownSpec: docs/architecture/roles/data-store.md
  - name: external-client
    targets: [function, class]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/git/**/*.ts
      - packages/riviere-cli/src/features/*/infra/external-client/**/*.ts
      - tools/dev-workflow/platform/infra/external-client/**/*.ts
      - tools/dev-workflow-v2/src/infra/external-client/**/*.ts
      - tools/dev-workflow-v2/src/workflow-definition/infra/external-client/**/*.ts
      - packages/riviere-role-enforcement/src/features/check/infra/external-client/**/*.ts
    nameMatches: '^(create|default|detect|extract|fetch|find|get|is|list|load|parse|read|resolve|run)[A-Z].*|^.*(Builder|Client|Io|Runner|Searcher)$'
    markdownSpec: docs/architecture/roles/external-client.md
  - name: source-file-filter
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/source-filtering/**/*.ts
    nameMatches: '^(filter|is|resolve|should)[A-Z].*'
    markdownSpec: docs/architecture/roles/source-file-filter.md
  - name: domain-error
    targets: [class]
    allowedLocation:
      - packages/riviere-builder/src/features/building/domain/**/*.ts
      - packages/riviere-cli/src/features/*/domain/**/*.ts
      - packages/riviere-cli/src/platform/domain/**/*.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
      - packages/riviere-extract-ts/src/features/extraction/domain/**/*.ts
      - tools/dev-workflow/features/*/domain/**/*.ts
      - tools/dev-workflow/platform/domain/**/*.ts
      - tools/dev-workflow-v2/src/**/domain/**/*.ts
    nameMatches: '^.*Error$'
    markdownSpec: docs/architecture/roles/domain-error.md
  - name: config-validation-service
    targets: [function]
    allowedLocation:
      - packages/riviere-extract-config/src/*.ts
    nameMatches: '^(isValid|validate|map|format|has|get)[A-Z].*|^formatValidationErrorsInternal$'
    markdownSpec: docs/architecture/roles/config-validation-service.md
  - name: glob-matcher
    targets: [function]
    allowedLocation:
      - packages/riviere-extract-ts/src/platform/infra/glob-matching/**/*.ts
    nameMatches: '^(minimatch|match|normalize)[A-Z].*'
    markdownSpec: docs/architecture/roles/glob-matcher.md
  - name: workflow-step
    targets: [function]
    allowedLocation:
      - tools/dev-workflow/features/*/domain/steps/**/*.ts
    nameMatches: '^(create|fetch|run|submit|verify|remove|merge)[A-Z].*'
    markdownSpec: docs/architecture/roles/workflow-step.md
  - name: workflow-execution-adapter
    targets: [function]
    allowedLocation:
      - tools/dev-workflow/platform/infra/workflow-execution/**/*.ts
    nameMatches: '^(runWorkflow|handleWorkflowError|executeWorkflow|writeOptionalFiles|noop)$'
    markdownSpec: docs/architecture/roles/workflow-execution-adapter.md
  - name: role-command-parser
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/src/features/check/domain/role-enforcement-command.ts
    allowedNames:
      - parseRoleEnforcementCommandArgs
    markdownSpec: docs/architecture/roles/role-command-parser.md
  - name: role-checker
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/src/features/check/domain/check-role-target.ts
    nameMatches: '^(checkTargetSymbol|findAssignedRoleDefinition|isFileInScope|isFileInsideScopeRoots|create|format|hasAllowed).*$'
    markdownSpec: docs/architecture/roles/role-checker.md
  - name: role-target-extractor
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/src/features/check/infra/role-target-extraction.ts
      - packages/riviere-role-enforcement/src/features/check/infra/role-target-extraction-types.ts
    nameMatches: '^(extractRoleTargets|getPublicMethodNames|create|mergeResults|getAnnotatedDeclaration|is).*$'
    markdownSpec: docs/architecture/roles/role-target-extractor.md
  - name: role-assignment-parser
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/src/features/check/infra/role-assignment.ts
    nameMatches: '^(parseRoleAssignment|createRoleAssignmentIssue|getComments|parseRoleAssignments|sanitizeCommentLine|format).*$'
    markdownSpec: docs/architecture/roles/role-assignment-parser.md
  - name: role-config-loader
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/src/platform/infra/load-role-enforcement-config.ts
    nameMatches: '^(loadRoleEnforcementConfig|compileRoleEnforcementConfig|compileRoleDefinition|compileNamePattern|formatZodPath|toRoleEnforcementConfigError).*$'
    markdownSpec: docs/architecture/roles/role-config-loader.md
  - name: path-pattern-matcher
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/src/platform/infra/path-patterns.ts
    nameMatches: '^(normalize|escape|globPatternTo|create|matches).*$'
    markdownSpec: docs/architecture/roles/path-pattern-matcher.md
  - name: role-classifier
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/src/features/classify/domain/**/*.ts
    nameMatches: '^(classify|create|find|infer|tokenize|score|rank).*$'
    markdownSpec: docs/architecture/roles/role-classifier.md
  - name: role-enforcement-runner
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/src/features/check/infra/run-role-enforcement-command.ts
    nameMatches: '^(runRoleEnforcementCommand|createOxlintConfig|getOxlintBinaryPath)$'
    markdownSpec: docs/architecture/roles/role-enforcement-runner.md
