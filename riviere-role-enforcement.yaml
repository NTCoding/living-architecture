include:
  - packages/riviere-cli/src/**/*.ts
  - packages/riviere-builder/src/**/*.ts
  - packages/riviere-extract-config/src/**/*.ts
  - packages/riviere-extract-ts/src/**/*.ts
  - packages/riviere-query/src/**/*.ts
  - packages/riviere-role-enforcement/src/**/*.ts
  - tools/dev-workflow/**/*.ts
  - tools/dev-workflow-v2/src/**/*.ts
ignorePatterns:
  - '**/*.spec.ts'
  - '**/*.snap'
  - '**/fixtures/**'
  - '**/__fixtures__/**'
  - '**/generated/**'
  - '**/index.ts'
roles:
  - name: cli-shell
    targets: [function]
    allowedLocation:
      - '**/shell/**/*.ts'
    allowedNames:
      - createProgram
      - main
    markdownSpec: docs/architecture/roles/cli-shell.md
  - name: cli-entrypoint
    targets: [function]
    allowedLocation:
      - '**/entrypoint/**/*.ts'
    nameMatches: '^create[A-Z][A-Za-z0-9]*Command$'
    markdownSpec: docs/architecture/roles/cli-entrypoint.md
  - name: command-use-case
    targets: [function]
    allowedLocation:
      - '**/commands/**/*.ts'
    markdownSpec: docs/architecture/roles/command-use-case.md
  - name: query-service
    targets: [function]
    allowedLocation:
      - '**/queries/**/*.ts'
    markdownSpec: docs/architecture/roles/query-service.md
  - name: cli-output-writer
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/cli/output/**/*.ts
      - packages/riviere-cli/src/features/*/infra/cli/output/**/*.ts
    allowedNames:
      - outputResult
      - reportNoApiFoundForPath
      - reportAmbiguousApiMatch
      - reportSuccessfulAddComponent
      - reportGraphNotFound
      - reportAddComponentError
      - reportValidationErrorOutput
      - presentExtractionResult
      - presentDraftResult
      - presentFullResult
    markdownSpec: docs/architecture/roles/cli-output-writer.md
  - name: aggregate
    targets: [class, static-method]
    allowedLocation:
      - packages/riviere-builder/src/features/building/domain/builder-facade.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
      - tools/dev-workflow-v2/src/workflow-definition/domain/**/*.ts
    nameMatches: '^[A-Z][A-Za-z0-9]*$|^(new|resume|fromJSON|createFresh|rehydrate|procedurePath)$'
    markdownSpec: docs/architecture/roles/aggregate.md
  - name: entity
    targets: [class]
    allowedLocation:
      - packages/riviere-query/src/features/querying/queries/**/*.ts
    nameMatches: '^[A-Z][A-Za-z0-9]*$'
    markdownSpec: docs/architecture/roles/entity.md
  - name: value-object
    targets: [function, class]
    allowedLocation:
      - packages/riviere-query/src/features/querying/queries/domain-types.ts
      - packages/riviere-cli/src/features/extract/domain/**/*.ts
    nameMatches: '^(parse[A-Z].*|.*(Id|Name|State|Location|Context))$'
    markdownSpec: docs/architecture/roles/value-object.md
  - name: domain-service
    targets: [function, class, static-method]
    allowedLocation:
      - packages/riviere-builder/src/features/building/domain/**/*.ts
      - packages/riviere-builder/src/platform/domain/**/*.ts
      - packages/riviere-extract-config/src/*.ts
      - packages/riviere-cli/src/features/extract/domain/**/*.ts
      - packages/riviere-cli/src/platform/domain/**/*.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
      - packages/riviere-extract-ts/src/features/extraction/domain/**/*.ts
      - packages/riviere-role-enforcement/src/features/*/domain/**/*.ts
      - packages/riviere-role-enforcement/src/platform/domain/**/*.ts
      - tools/dev-workflow/features/*/domain/**/*.ts
      - tools/dev-workflow/platform/domain/**/*.ts
      - tools/dev-workflow-v2/src/workflow-definition/domain/**/*.ts
    nameMatches: '^[A-Za-z][A-Za-z0-9]*$'
    markdownSpec: docs/architecture/roles/domain-service.md
  - name: domain-factory
    targets: [class, function]
    allowedLocation:
      - packages/riviere-cli/src/features/*/domain/**/*.ts
      - packages/riviere-extract-config/src/*.ts
      - packages/riviere-role-enforcement/src/features/*/domain/**/*.ts
    nameMatches: '^(create|build)[A-Z].*|^.*Builder$'
    markdownSpec: docs/architecture/roles/domain-factory.md
  - name: application-error
    targets: [class]
    allowedLocation:
      - packages/riviere-cli/src/features/*/domain/**/*.ts
      - packages/riviere-cli/src/features/*/commands/**/*.ts
      - packages/riviere-cli/src/features/*/infra/**/*.ts
      - packages/riviere-cli/src/platform/infra/**/*.ts
      - packages/riviere-builder/src/features/building/domain/**/*.ts
      - packages/riviere-extract-config/src/*.ts
      - packages/riviere-extract-ts/src/features/extraction/domain/**/*.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
      - packages/riviere-role-enforcement/src/platform/domain/**/*.ts
      - tools/dev-workflow/features/*/commands/**/*.ts
      - tools/dev-workflow/features/*/domain/**/*.ts
      - tools/dev-workflow/platform/domain/**/*.ts
      - tools/dev-workflow/platform/infra/**/*.ts
      - tools/dev-workflow-v2/src/**/domain/**/*.ts
      - tools/dev-workflow-v2/src/**/infra/**/*.ts
    nameMatches: '^.*Error$'
    markdownSpec: docs/architecture/roles/application-error.md
  - name: cli-input-mapper
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/cli/input/**/*.ts
      - packages/riviere-cli/src/features/*/infra/cli/input/**/*.ts
      - packages/riviere-cli/src/shell/**/*.ts
      - packages/riviere-role-enforcement/src/features/check/domain/**/*.ts
      - tools/dev-workflow/platform/infra/cli/**/*.ts
      - tools/dev-workflow/features/*/domain/**/*parser*.ts
    nameMatches: '^(parse|validate|collect|resolve|sanitize|tryParse|read|reject|normalize|build|is|has|map|to)[A-Z].*'
    markdownSpec: docs/architecture/roles/cli-input-mapper.md
  - name: cli-output-formatter
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/cli/output/**/*.ts
      - packages/riviere-cli/src/platform/infra/errors/**/*.ts
      - tools/dev-workflow/platform/infra/cli/**/*.ts
      - tools/dev-workflow/features/*/domain/*output*.ts
    nameMatches: '^(format|categorize|count|summarize|compare|to|get)[A-Z].*|^(compareByCodePoint|componentKey)$'
    markdownSpec: docs/architecture/roles/cli-output-formatter.md
  - name: middleware
    targets: [function]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/middleware/**/*.ts
      - tools/dev-workflow-v2/src/entrypoint/**/*.ts
      - tools/dev-workflow/features/claude-hooks/commands/**/*.ts
      - tools/dev-workflow/platform/infra/workflow-execution/**/*.ts
    nameMatches: '^(handle|report|pre|post|route|should|stop|run|execute|write|noop)[A-Z].*|^.*Handler$'
    markdownSpec: docs/architecture/roles/middleware.md
  - name: repository
    targets: [function, class]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/graph-persistence/**/*.ts
      - packages/riviere-cli/src/platform/infra/persistence/**/*.ts
      - packages/riviere-role-enforcement/src/platform/infra/**/*.ts
    nameMatches: '^(load|read|write|save|find|resolve|get|with|parse|is|report|handle|try|compile|to)[A-Z].*|^fileExists$|^.*Repository$'
    markdownSpec: docs/architecture/roles/repository.md
  - name: data-store
    targets: [function, class]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/persistence/**/*.ts
    nameMatches: '^(load|read|write|save|find|resolve|get|create|build|parse|expand|is|has|try)[A-Z].*|^.*Store$'
    markdownSpec: docs/architecture/roles/data-store.md
  - name: external-client
    targets: [function, class]
    allowedLocation:
      - packages/riviere-cli/src/platform/infra/git/**/*.ts
      - packages/riviere-cli/src/features/*/infra/external-client/**/*.ts
      - packages/riviere-cli/src/platform/infra/source-filtering/**/*.ts
      - packages/riviere-extract-ts/src/platform/infra/external-client/**/*.ts
      - tools/dev-workflow/platform/infra/external-client/**/*.ts
      - tools/dev-workflow-v2/src/infra/cli/**/*.ts
      - tools/dev-workflow-v2/src/infra/external-client/**/*.ts
      - tools/dev-workflow-v2/src/workflow-definition/infra/external-client/**/*.ts
      - packages/riviere-role-enforcement/src/features/check/infra/**/*.ts
      - packages/riviere-role-enforcement/src/platform/infra/path-patterns.ts
      - packages/riviere-role-enforcement/src/features/check/infra/external-client/**/*.ts
    nameMatches: '^(create|default|detect|escape|extract|fetch|filter|find|format|get|globPatternTo|is|list|load|matches|merge|normalize|parse|read|resolve|run|sanitize)[A-Z].*|^.*(Builder|Client|Io|Runner|Searcher)$'
    markdownSpec: docs/architecture/roles/external-client.md
  - name: domain-error
    targets: [class]
    allowedLocation:
      - packages/riviere-builder/src/features/building/domain/**/*.ts
      - packages/riviere-cli/src/features/*/domain/**/*.ts
      - packages/riviere-cli/src/platform/domain/**/*.ts
      - packages/riviere-query/src/features/querying/queries/**/*.ts
      - packages/riviere-extract-ts/src/features/extraction/domain/**/*.ts
      - tools/dev-workflow/features/*/domain/**/*.ts
      - tools/dev-workflow/platform/domain/**/*.ts
      - tools/dev-workflow-v2/src/**/domain/**/*.ts
    nameMatches: '^.*Error$'
    markdownSpec: docs/architecture/roles/domain-error.md
