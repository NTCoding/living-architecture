include:
  - packages/riviere-role-enforcement/fixtures/oxlint-spike/src/**/*.ts
roles:
  - name: cli-shell
    targets: [function]
    allowedLocation:
      - packages/riviere-role-enforcement/fixtures/oxlint-spike/src/shell/**/*.ts
    allowedNames:
      - createProgram
      - main
    markdownSpec: docs/architecture/roles/cli-shell.md
  - name: aggregate
    targets: [class]
    allowedLocation:
      - packages/riviere-role-enforcement/fixtures/oxlint-spike/src/features/*/queries/**/*.ts
    nameMatches: ^.*Query$
    allowedPublicMethods:
      - components
      - validate
    markdownSpec: docs/architecture/roles/aggregate.md
