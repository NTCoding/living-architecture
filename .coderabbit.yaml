# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Configuration
# Docs: https://docs.coderabbit.ai/reference/configuration

language: en-US

reviews:
  profile: assertive
  request_changes_workflow: true
  assess_linked_issues: true
  sequence_diagrams: true
  instructions: >-
    Before flagging code as violating the architecture, a boundary, or a
    workflow contract, verify the intent first: read the linked issue, the
    ARCH.md sections it references (docs/project/PRD/**/ARCH.md),
    project-memory/architecture/memories/, and the git history of the code
    being flagged. If the pattern matches a documented, approved decision,
    do not flag it. If the evidence is unclear, ask a question and name the
    document you checked, rather than raising a Major finding.
  auto_review:
    enabled: true
  pre_merge_checks:
    docstrings:
      mode: 'off'
    issue_assessment:
      mode: 'error'
  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    actionlint:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'docs/conventions/software-design.md'
      - 'docs/conventions/anti-patterns.md'
      - 'docs/conventions/testing.md'
      - 'docs/conventions/standard-patterns.md'
      - 'docs/architecture/adr/ADR-002-allowed-folder-structures.md'
      - 'docs/architecture/overview.md'
      - 'docs/conventions/review-feedback-checks.md'
