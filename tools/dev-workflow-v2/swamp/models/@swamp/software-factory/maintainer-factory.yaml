type: '@swamp/software-factory'
typeVersion: 2026.06.24.1
id: 0255e360-4707-4d5f-8cde-8981367bf737
name: maintainer-factory
version: 1
tags: {}
globalArguments:
  stages:
    - id: preparing
      initial: true
      description: >-
        Branch from the refreshed default branch. Deterministic; no agent.
      work:
        mode: workflow
        workflow:
          name: maintainer-prepare-issue
          inputs:
            issue: '${{ self.workItem }}'
        resultEvidence: prepare-outcome
      transitions:
        - name: branch-ready
          to: confirm-plan
          gates:
            - type: workflow-succeeded
              config: { workflow: maintainer-prepare-issue }

    - id: confirm-plan
      description: >-
        Confirm the approach before any code is written. The plan step of the
        implementation workflow. It is not the planning workflow, which produces
        a PRD and is out of scope here.
      work:
        mode: interactive
        systemPrompt: |
          Read the GitHub issue, docs/conventions/, ADR-002 and the code you
          intend to change.

          Decide your approach, then record one artifact with record_artifact:

            name:    plan
            payload: { summary, steps, testingStrategy, risks, filesToChange }

          `steps` is a list of objects: { description, files }. `risks` may be
          empty. Do not write the plan to a file. The artifact is the record.

          Change no code in this stage. Do not run git, gh or pnpm.
      artifacts:
        - name: plan
          description: The approach decided before any code is written.
          schema:
            type: object
            additionalProperties: false
            required: [summary, steps, testingStrategy, risks, filesToChange]
            properties:
              summary: { type: string, minLength: 1 }
              steps:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [description, files]
                  properties:
                    description: { type: string, minLength: 1 }
                    files:
                      type: array
                      minItems: 1
                      items: { type: string, minLength: 1 }
              testingStrategy: { type: string, minLength: 1 }
              risks: { type: array, items: { type: string } }
              filesToChange:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
      transitions:
        - name: confirmed
          to: implementing
          gates:
            - type: artifact-exists
              config: { artifact: plan }

    - id: implementing
      description: >-
        Write the code and the tests the plan describes, then record the change.
        The commit message is an artefact field so that git commit is a fixed
        command.
      work:
        mode: interactive
        systemPrompt: |
          Implement the plan recorded for this work item. Read it with:

            swamp model method run maintainer-factory status --input workItem=<ref>

          Follow docs/conventions/.

          Record one artifact with record_artifact:

            name:    change
            payload: { summary, commitMessage, files }

          `commitMessage` must be a conventional commit subject line, 72
          characters or fewer, lower case after the type, no trailing full stop.
          `files` lists every path you changed, relative to the repository root.

          You never run git, gh or pnpm in this stage. A later stage commits,
          verifies and pushes on your behalf. Do not run them.
      artifacts:
        - name: change
          description: The change to commit, including the commit message.
          schema:
            type: object
            additionalProperties: false
            required: [summary, commitMessage, files]
            properties:
              summary: { type: string, minLength: 1 }
              commitMessage: { type: string, minLength: 1, maxLength: 72 }
              files:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
      transitions:
        - name: record
          to: committing
          gates:
            - type: artifact-exists
              config: { artifact: change }

    - id: committing
      description: >-
        git add and git commit using the recorded message, then prove the tree is
        clean and the branch is ahead. Deterministic; no agent.
      work:
        mode: workflow
        workflow:
          name: maintainer-commit
          inputs:
            workItem: '${{ self.workItem }}'
        resultEvidence: commit-outcome
      transitions:
        - name: committed
          to: verifying
          gates:
            - type: workflow-succeeded
              config: { workflow: maintainer-commit }

    - id: verifying
      description: >-
        Run the repository gate. A failure routes back to the agent rather than
        failing the run. Deterministic; no agent.
      work:
        mode: workflow
        workflow:
          name: maintainer-verify
        resultEvidence: checks
      transitions:
        - name: pass
          to: submitting
          gates:
            - type: workflow-succeeded
              config: { workflow: maintainer-verify }
        - name: fail
          to: implementing

    - id: submitting
      description: >-
        Push the branch and open the pull request. The description is composed
        from the recorded change, so it cannot drift from what was done.
        Deterministic; no agent.
      work:
        mode: workflow
        workflow:
          name: maintainer-submit
          inputs:
            workItem: '${{ self.workItem }}'
        resultEvidence: submit-outcome
      transitions:
        - name: opened
          to: reviewing
          gates:
            - type: workflow-succeeded
              config: { workflow: maintainer-submit }

    - id: reviewing
      description: >-
        Fresh reviewer per role, coordinated deterministically. Each finding is
        recorded with the factory's findings contract so a gate can count it, and
        its file and line are recorded separately so it can be posted inline.
        Capped at three cycles; past the cap the run parks for a human.
      maxCycles: 3
      work:
        mode: dispatch
        systemPrompt: |
          Review the change on the pull request for this work item, once per
          reviewer role. Read each role's procedure before you start it:

            tools/dev-workflow-v2/agents/architecture-review.md
            tools/dev-workflow-v2/agents/code-review.md
            tools/dev-workflow-v2/agents/bug-scanner.md
            tools/dev-workflow-v2/agents/task-check.md

          `task-check` runs once per GitHub issue the pull request resolves. If
          no issue is linked, skip that role and say so in the findings.

          Read the diff since the previous reviewed commit, not the whole
          repository.

          Record two artefacts, one call each.

          First the findings, with record_artifact:

            name:    review
            payload: { findings: [{ id, severity, description, category }] }

          severity is one of critical, high, medium or low. id is any stable
          string unique within this review. Do not soften findings.

          Then the locations, with record_artifact:

            name:    review-locations
            payload: { locations: [{ findingId, path, line }] }

          One entry per finding, naming the file path relative to the repository
          root and the line number in the added side of the diff. A finding that
          genuinely names no line can be left out, and it will be posted as an
          ordinary comment instead.

          Do not run git, gh or pnpm.
      artifacts:
        - name: review
          description: Findings from every reviewer for this cycle.
          kind: findings
          reviews: change
        - name: review-locations
          description: The file and line each finding belongs to.
          reviews: change
          schema:
            type: object
            additionalProperties: false
            required: [locations]
            properties:
              locations:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [findingId, path, line]
                  properties:
                    findingId: { type: string, minLength: 1 }
                    path: { type: string, minLength: 1 }
                    line: { type: integer, minimum: 1 }
      transitions:
        - name: clean
          to: awaiting-coderabbit
          gates:
            - type: artifact-fresh
              config: { artifact: review, recordedThisCycle: true }
            - type: findings-clear
              config: { artifact: review, blocking: [critical, high] }
        - name: needs-work
          to: addressing

    - id: addressing
      description: >-
        A fresh agent with a fresh context window resolves the findings, starting
        from the findings themselves and never from the implementation
        conversation.
      work:
        mode: interactive
        systemPrompt: |
          Resolve the open findings on the `review` artifact for this work item.

          Read the findings with:
            swamp model method run maintainer-factory status --input workItem=<ref>

          Change code and tests. Then:
          1. Record the updated change artifact, with a new commitMessage that
             describes the fix.
          2. Call resolve_findings on the `review` artifact, naming each finding
             you addressed and how.

          Do not run git, gh or pnpm.
      transitions:
        - name: resolved
          to: committing
          gates:
            - type: artifact-exists
              config: { artifact: change }

    - id: awaiting-coderabbit
      description: >-
        Wait for the external reviewer to review the pushed commit. Deterministic;
        no agent. The cooldown stops an immediate re-check of the same commit.
      work:
        mode: workflow
        workflow:
          name: maintainer-await-coderabbit
          inputs:
            pr: '${{ data.latest("maintainer-git", "pull-request").attributes.number }}'
        resultEvidence: coderabbit-outcome
      transitions:
        - name: reviewed
          to: publishing-findings
          gates:
            - type: workflow-succeeded
              config: { workflow: maintainer-await-coderabbit }

    - id: publishing-findings
      description: >-
        Post every recorded finding to GitHub as a review comment. Deterministic;
        no agent, so the comment format never varies.
      work:
        mode: workflow
        workflow:
          name: maintainer-publish-findings
          inputs:
            pr: '${{ data.latest("maintainer-git", "pull-request").attributes.number }}'
            headSha: '${{ data.latest("maintainer-git", "pull-request").attributes.headSha }}'
            findings: '${{ data.latest("maintainer-factory", "artifact-" + workItem + "-review").payload.findings }}'
            locations: '${{ data.latest("maintainer-factory", "artifact-" + workItem + "-review-locations").payload.locations }}'
        resultEvidence: publish-outcome
      transitions:
        - name: posted
          to: awaiting-human-review
          gates:
            - type: workflow-succeeded
              config: { workflow: maintainer-publish-findings }

    - id: awaiting-human-review
      description: The pull request is open and every automated reviewer is done.
      terminal: true

    - id: aborted
      description: The run was stopped deliberately.
      terminal: true

  globalTransitions:
    - name: abort
      description: Stop this work item.
      to: aborted
      gates:
        - type: human-approval
          config: { id: abort-confirmation }
methods: {}
