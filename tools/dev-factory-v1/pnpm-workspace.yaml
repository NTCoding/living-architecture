packages:
  - '*'
  - 'software-factory/*'

autoInstallPeers: true
engineStrict: true
minimumReleaseAge: 10080

overrides:
  'eslint-plugin-sonarjs>typescript': npm:typescript@5.9.3
  nanoid@: 3.3.17
  postcss: 8.5.25

allowBuilds:
  '@google/genai': false
  '@scarf/scarf': false
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  unrs-resolver: true
